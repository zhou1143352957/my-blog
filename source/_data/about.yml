# 自定义
cause:
  tip: 心路历程
  title: 为什么建站？
  content:
    <br>
    建这个站，其实原因很简单：我想要一个能让我<b>持续积累知识、顺便沉淀兴趣</b>的小角落。
    把学到的、踩过的坑、突然想到的点子记录下来，再分享给别人，时间久了，它们就不只是零散的记忆，而是慢慢堆起来的东西。
    如果这些内容刚好还能<b>帮你解决点问题</b>，那这件事就变得更酷了。
    <br><br>
    和那种“只写某一门技术”的博客不太一样，这里会有点杂。
    可能是<b>技能相关的实战干货</b>，也可能是<b>生活里的吐槽和小技巧</b>，再或者是<b>一些突然冒出来的想法和思考</b>。
    简单说一句：我在研究什么、发现了什么，大概率都会被我扔到这里。
    <br><br>
    这就是这个小站存在的原因，<b>也是我记录和分享生活的一种方式</b>。
    如果你刚好路过这里，希望你能找到点有用的、好玩的，甚至是会心一笑的东西。
    很高兴在这里遇见你，也希望我们能一起留下点不错的回忆。
    <br>

