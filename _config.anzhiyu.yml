menu: # 菜单配置
  # 文章:
  #   隧道: /archives/ || anzhiyu-icon-box-archive
  #   分类: /categories/ || anzhiyu-icon-shapes
  #   标签: /tags/ || anzhiyu-icon-tags

  # 友链:
  #   友人帐: /link/ || anzhiyu-icon-link
  #   朋友圈: /fcircle/ || anzhiyu-icon-artstation
  #   留言板: /comments/ || anzhiyu-icon-envelope

  # 我的:
  #   音乐馆: /music/ || anzhiyu-icon-music
  #   追番页: /bangumis/ || anzhiyu-icon-bilibili
  #   相册集: /album/ || anzhiyu-icon-images
  #   小空调: /air-conditioner/ || anzhiyu-icon-fan

  # 关于:
  #   关于本人: /about/ || anzhiyu-icon-paper-plane
  #   闲言碎语: /essay/ || anzhiyu-icon-lightbulb
  #   随便逛逛: javascript:toRandomPost() || anzhiyu-icon-shoe-prints1

# nav相关配置
nav: # 导航配置
  enable: true # 是否启用
  travelling: true # 导航旅行模块开关
  clock: true # 导航时钟开关
  menu: # 菜单配置
    - title: 网页 # 标题
      item:  # 列表项
        - name: 博客 # 名称
          link: https://hexo.anheyu.com/ # 链接
          icon: /img/favicon.ico # 图标
    - title: 项目 # 标题
      item:  # 列表项
        - name: 安知鱼图床 # 名称
          link: https://image.anheyu.com/ # 链接
          icon: https://image.anheyu.com/favicon.ico # 图标

# mourn （哀悼日，指定日期网站简单变灰，不包括滚动条）
# 注意： 仅网站首页变灰，其他页面正常显示
mourn: # 哀悼日设置
  enable: false # 是否启用
  days: [4-5, 5-12, 7-7, 9-18, 12-13] # 日期列表

# Code Blocks (代码相关)
# --------------------------------------

highlight_theme: mac light #  darker / pale night / light / ocean / mac / mac light / false
highlight_copy: true # 复制按钮
highlight_lang: true # 显示代码语言
highlight_shrink: none # true: 缩小代码块 / false: 扩展代码块 | none: 展开代码块并隐藏按钮
highlight_height_limit: 330 # unit: px
code_word_wrap: true # 代码自动换行

# copy settings
# copyright: Add the copyright information after copied content (在复制内容后添加版权信息)
# copy: enable 复制后弹窗提示版权信息
copy: # 复制相关设置
  enable: true # 是否启用
  copyright: # 版权相关设置
    enable: false # 是否启用
    limit_count: 50 # 触发版权提示的最少字数

# social settings (社交图标设置)
formal:
   name: link || icon
social: # 社交图标设置
   YouTuBe: https://www.youtube.com/channel/UCi0sCjuikqv_oTJk1hKNvag || anzhiyu-icon-youtube
   Github: https://github.com/anzhiyu-As || anzhiyu-icon-github
  # BiliBili: https://space.bilibili.com/372204786 || anzhiyu-icon-bilibili


# 作者卡片 状态
author_status: # 作者状态卡设置
  enable: true # 是否启用
  # 可以是任何图片，建议放表情包或者emoji图片，效果都很好，[表情包速查](https://emotion.xiaokang.me/)
  statusImg: "https://bu.dusays.com/2023/08/24/64e6ce9c507bb.png" # 状态图片
  skills: # 状态文案列表
     - 🤖️ 数码科技爱好者
    # - 🔍 分享与热心帮助
    # - 🏠 智能家居小能手
     - 🔨 设计开发一条龙
    # - 🤝 专修交互与设计
    # - 🏃 脚踏实地行动派
    # - 🧱 团队小组发动机
    # - 💢 壮汉人狠话不多

# search (搜索)
# --------------------------------------

# Algolia search
algolia_search: # Algolia 搜索设置
  enable: false # 是否启用
  hits: # 搜索结果设置
    per_page: 6 # 每页相关配置
  tags:  # 标签
    - 前端
    - 后端
    # - Hexo

# Docsearch
# Apply and Option Docs: see https://docsearch.algolia.com/
# Crawler Admin Console: see https://crawler.algolia.com/
# Settings: https://www.algolia.com/
docsearch: # Docsearch 设置
  enable: false # 是否启用
  appId: # see email
  apiKey: # see email
  indexName: # see email
  option: # 选项

# Local search
local_search: # 本地搜索设置
  enable: false # 是否启用
  preload: true # 预加载
  CDN: # CDN

# Math (数学)
# --------------------------------------
# About the per_page
# if you set it to true, it will load mathjax/katex script in each page (true 表示每一页都加载js)
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' in page's front-matter)
# (false 需要时加载，须在使用的 Markdown Front-matter 加上 mathjax: true)

# MathJax
mathjax: # MathJax 配置
  enable: false # 是否启用
  per_page: false # 每页相关配置

# KaTeX
katex: # KaTeX 配置
  enable: false # 是否启用
  per_page: false # 每页相关配置
  hide_scrollbar: true # 隐藏滚动条

# Image (图片设置)
# --------------------------------------

# Favicon（网站图标）
favicon: /favicon.ico # 站点图标

# Avatar (头像)
avatar: # 头像设置
  img: https://bu.dusays.com/2023/04/27/64496e511b09c.jpg # 图片
  effect: false # 特效

# Disable all banner image
disable_top_img: true # 禁用顶部大图

# The banner image of home page (首页横幅图片)
index_img: false # "background: url() top / cover no-repeat"

# If the banner of page not setting, it will show the top_img
default_top_img: false # 默认顶部图

cover: # 封面设置
  # display the cover or not (是否显示文章封面)
  index_enable: true # 首页启用封面
  aside_enable: true # 侧边栏启用封面
  archives_enable: true # 归档页启用封面
  # the position of cover in home page (封面显示的位置)
  # left/right/both
  position: left # 位置
  # When cover is not set, the default cover is displayed (当没有设置cover时，默认的封面显示)
  default_cover: # 默认封面
    # - /img/default_cover.jpg

# Replace Broken Images (替换无法显示的图片)
error_img: # 错误图片替换
  flink: /img/friend_404.gif # 友链错误图
  post_page: /img/404.jpg # 文章页错误图

# A simple 404 page
error_404: # 404 页面设置
  enable: true # 是否启用
  subtitle: "请尝试站内搜索寻找文章" # 副标题/提示文案
  background: https://bu.dusays.com/2023/05/08/645907596997d.gif # 背景

post_meta: # 文章元信息
  page: # Home Page
    date_type: created # created or updated or both 主页文章日期是创建日或者更新日或都显示
    date_format: simple # date/relative/simple 显示日期还是相对日期 或者 简单日期
    categories: true # true or false 主页是否显示分类
    tags: true # true or false 主页是否显示标籤
    label: false # true or false 显示描述性文字
  post: # 文章
    date_type: both # created or updated or both 文章页日期是创建日或者更新日或都显示
    date_format: date # date/relative 显示日期还是相对日期
    categories: true # true or false 文章页是否显示分类
    tags: true # true or false 文章页是否显示标籤
    label: true # true or false 显示描述性文字
    unread: false # true or false 文章未读功能

# 主色调相关配置
mainTone: # 主色调配置
  enable: false # true or false 文章是否启用获取图片主色调
  mode: api # colorthief/cdn/api/both colorthief模式为前端获取图片主色调，cdn模式为图片url+imageAve参数获取主色调，api模式为请求API获取主色调，both模式会先请求cdn参数，无法获取的情况下将请求API获取，可以在文章内配置main_color: '#3e5658'，使用十六进制颜色，则不会请求colorthief/cdn/api/both获取主色调，而是直接使用配置的颜色
  # 项目地址：https://github.com/anzhiyu-c/img2color-go
  api: https://img2color-go.vercel.app/api?img= # mode为api时可填写
  cover_change: true # 整篇文章跟随cover修改主色调

# wordcount (字数统计)
wordcount: # 字数统计设置
  enable: false # 是否启用
  post_wordcount: true # 文章字数统计
  min2read: true # 预计阅读时长
  total_wordcount: true # 全站字数统计

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content: # 首页文章摘要设置
  method: 3 # 显示方式
  length: 500 # if you set method to 2 or 3, the length need to config

# anchor
# when you scroll in post, the URL will update according to header id.
anchor: false # 标题锚点开关

# Post
# --------------------------------------

# toc (目录)
toc: # 目录设置
  post: true # 文章
  page: false # 页面
  number: true # 数量
  expand: false # 是否展开
  style_simple: false # for post

post_copyright: # 文章版权声明
  enable: true # 是否启用
  decode: false # 是否解码版权信息
  author_href: # 作者链接
  location: 长沙 # 作者位置
  license: CC BY-NC-SA 4.0 # 许可协议
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/ # 许可链接
  avatarSinks: false # hover时头像下沉
  copyright_author_img_back: # 版权卡片背景图
  copyright_author_img_front: # 版权卡片前景图
  copyright_author_link: / # 版权卡片作者链接

# Sponsor/reward
reward: # 打赏设置
  enable: true # 是否启用
  QR_code: # 二维码列表
    - img: https://npm.elemecdn.com/anzhiyu-blog@1.1.6/img/post/common/qrcode-weichat.png # 图片
      link: # 链接
      text: 微信 # 文字
    - img: https://npm.elemecdn.com/anzhiyu-blog@1.1.6/img/post/common/qrcode-alipay.png # 图片
      link: # 链接
      text: 支付宝 # 文字

# Post edit
# Easily browse and edit blog source code online.
post_edit: # 目前仅可选择一个平台在线编辑
  enable: false # 是否启用
  # github: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  github: false # GitHub 编辑链接

  # yuque: https://www.yuque.com/user-name/repo-name/
  # 示例: https://www.yuque.com/yuque/yuque/
  # 你需要在语雀文章 Front Matter 添加参数 id 并确保其唯一性（例如 “id: yuque”, “id: 01”）
  yuque: false # 语雀编辑链接

# Related Articles
related_post: # 相关文章设置
  enable: true # 是否启用
  limit: 6 # Number of posts displayed
  date_type: created # or created or updated 文章日期显示创建日或者更新日

# figcaption (图片描述文字)
photofigcaption: false # 图片说明文字开关

# post_pagination (分页)
# value: 1 || 2 || 3 || 4 || false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# 3: 只有下一篇，并且只在文章滚动到评论区时显示下一篇文章(旧文章)
# 4: 只有下一篇，并且只在文章滚动到评论区时显示下一篇文章(旧文章) 显示图片cover
# false: disable pagination
post_pagination: 2 # 文章分页模式

# Displays outdated notice for a post (文章过期提醒)
noticeOutdate: # 文章过期提醒
  enable: false # 是否启用
  style: flat # style: simple/flat
  limit_day: 365 # When will it be shown
  position: top # position: top/bottom
  message_prev: It has been # 提示前缀文案
  message_next: days since the last update, the content of the article may be outdated. # 提示后缀文案

# Share System (分享功能)
# --------------------------------------

# Share.js
# https://github.com/overtrue/share.js
sharejs: # Share.js 分享设置
  enable: true # 是否启用
  sites: facebook,twitter,wechat,weibo,qq # 站点列表

# AddToAny
# https://www.addtoany.com/
addtoany: # AddToAny 分享设置
  enable: false # 是否启用
  item: facebook,twitter,wechat,sina_weibo,email,copy_link # 列表项

# Comments System
# --------------------------------------

comments: # 评论系统设置
  # Up to two comments system, the first will be shown as default
  # Choose: Valine/Waline/Twikoo/Artalk
  use: # Twikoo/Waline
  text: true # Display the comment name next to the button
  # lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comment count will be invalid
  lazyload: false # 懒加载设置
  count: false # Display comment count in post's top_img
  card_post_count: false # Display comment count in Home Page

# valine
# https://valine.js.org
valine: # Valine 配置
  appId: xxxxx # leancloud application app id
  appKey: xxxxx # leancloud application app key
  pageSize: 10 # comment list page size
  avatar: mp # gravatar style https://valine.js.org/#/avatar
  lang: zh-CN # i18n: zh-CN/zh-TW/en/ja
  placeholder: 填写QQ邮箱就会使用QQ头像喔~. # valine comment input placeholder (like: Please leave your footprints)
  guest_info: nick,mail,link # valine comment header info (nick/mail/link)
  recordIP: false # Record reviewer IP
  serverURLs: # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  bg: /img/comment_bg.png # valine background
  emojiCDN: //i0.hdslb.com/bfs/emote/ # emoji CDN
  enableQQ: true # enable the Nickname box to automatically get QQ Nickname and QQ Avatar
  requiredFields: nick,mail # required fields (nick/mail)
  visitor: false # 访客
  master: # 博主标识列表
    - xxxxx
  friends: # 友人标识列表
    - xxxxxx
  tagMeta: "博主,小伙伴,访客" # 标签元信息
  option: # 选项

# waline - A simple comment system with backend support fork from Valine
# https://waline.js.org/
waline: # Waline 配置
  serverURL: # Waline server address url
  bg: # Waline background
  pageview: false # 浏览量
  meta_css: false # 是否引入 waline-meta.css ,以便显示 meta图标
  imageUploader: true # 配置为 > 换行后可自定义图片上传逻辑，示例: https://waline.js.org/cookbook/customize/upload-image.html#案例
  # 以下为可选配置，后续若有新增/修改配置参数可在此自行添加/修改
  option: # 选项

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo: # Twikoo 配置
  envId: # 环境 ID
  region: # 地域
  visitor: false # 访客
  option: # 选项

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk: # Artalk 配置
  server: # 服务
  site: # 站点标识
  visitor: false # 访客
  option: # 选项

# giscus
# https://giscus.app/
giscus: # Giscus 配置
  repo: # GitHub repository name
  repo_id: # GitHub repository id
  category_id: # GitHub repository category id
  theme: # 主题
    light: light # 明亮
    dark: dark # 暗黑
  option: # options
    data-lang: zh-CN
    data-mapping:
    data-category:
    data-input-position:

