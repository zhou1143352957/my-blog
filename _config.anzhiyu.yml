  key: xxxx # 密钥
  Referer: https://xx.xx/ # Referer

# 快捷键配置
shortcutKey: # 密钥
  enable: false # 是否启用
  delay: 100 # 所有键位延时触发而不是立即触发（包括shift，以解决和浏览器键位冲突问题）
